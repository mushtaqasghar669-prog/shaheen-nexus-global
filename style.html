<style>
    :root {
        --primary-color: #0f172a;
        --accent-color: #38bdf8;
        --bg-color: #090d16;
        --card-bg: #1e293b;
        --text-color: #f8fafc;
        --border-color: #334155;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        line-height: 1.6;
    }

    header {
        background: var(--primary-color);
        color: #fff;
        padding: 3rem 1rem;
        text-align: center;
        border-bottom: 3px solid var(--accent-color);
    }

    header h1 {
        margin: 0;
        font-size: 2.8rem;
        color: var(--accent-color);
        letter-spacing: 1px;
    }

    header p {
        margin: 0.8rem auto 0;
        font-size: 1.2rem;
        opacity: 0.9;
        max-width: 800px;
    }

    .container {
        max-width: 1200px;
        margin: 2.5rem auto;
        padding: 0 1.5rem;
    }

    .intro-section {
        text-align: center;
        margin-bottom: 3rem;
    }

    .intro-section h2 {
        color: var(--accent-color);
        font-size: 2.2rem;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 2rem;
        margin-top: 2rem;
    }

    .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
        transform: translateY(-5px);
        border-color: var(--accent-color);
    }

    .card h3 {
        margin-top: 0;
        color: var(--accent-color);
        font-size: 1.5rem;
    }

    .btn {
        display: inline-block;
        background: var(--accent-color);
        color: var(--primary-color);
        padding: 0.7rem 1.4rem;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        margin-top: 1.2rem;
        transition: opacity 0.2s;
    }

    .btn:hover {
        opacity: 0.85;
    }

    /* AdSense Banner Custom Wrapper Styling */
    .adsense-banner {
        margin: 2rem auto;
        text-align: center;
        padding: 1rem;
        background: rgba(30, 41, 59, 0.5);
        border: 1px dashed var(--border-color);
        border-radius: 8px;
    }

    footer {
        text-align: center;
        padding: 2rem;
        background: var(--primary-color);
        color: #94a3b8;
        margin-top: 4rem;
        border-top: 1px solid var(--border-color);
    }
</style>
